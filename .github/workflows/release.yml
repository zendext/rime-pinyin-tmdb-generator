name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: rime-pinyin-tmdb-generator_linux_amd64
            ext: ""
          - goos: windows
            goarch: amd64
            artifact: rime-pinyin-tmdb-generator_windows_amd64
            ext: .exe
          - goos: darwin
            goarch: arm64
            artifact: rime-pinyin-tmdb-generator_macos_arm64
            ext: ""

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set Version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          asset="${{ matrix.artifact }}_${VERSION}${{ matrix.ext }}"
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/${asset}" \
            ./cmd/rime-pinyin-tmdb-generator

      - name: Checksums
        run: |
          cd dist
          asset="${{ matrix.artifact }}_${VERSION}${{ matrix.ext }}"
          sha256sum "${asset}" > "${asset}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}_*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: dist/*
